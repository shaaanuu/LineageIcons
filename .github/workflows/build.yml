name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. 1.0). Leave empty to only upload build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret set - building an unsigned APK. Add the signing secrets to publish installable releases."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Verify signature
        run: |
          if [ ! -f keystore.properties ]; then
            echo "::notice::Unsigned build, skipping signature verification."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true